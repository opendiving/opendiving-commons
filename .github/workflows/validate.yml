name: Validate

on:
  pull_request:

# Read-only, and on a fork it could be nothing else: the output is a job summary and
# annotations, never a comment, so no run here needs a write token or `pull_request_target`.
permissions:
  contents: read

jobs:
  # The required check. Its job id is the status-check context the `main` ruleset names, so
  # this job carries no `name:` - a display name would replace the id as the context, and the
  # ruleset would wait on a check that never reports.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - run: pip install -r requirements.txt

      - name: The record rules
        run: python scripts/validate.py

  # Not a required check, so a publish never waits on it. A job cannot carry a path filter of
  # its own, and a workflow-level one would skip `validate` too, so the job reads the changed
  # paths itself and passes without running anything when no code changed.
  #
  # A change to a seed counts as code here, because the suite pins the seed count. A publish
  # holding only contributions touches `sites/opendivingcommons/` alone, so it skips.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Did the code or the seed change?
        id: changes
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(scripts/|tests/|sites/openstreetmap/|sites/wikidata/|requirements\.txt$|\.github/workflows/validate\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Neither the code nor a seed changed; no tests to run."
          fi

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.15"

      - if: steps.changes.outputs.run == 'true'
        run: pip install -r requirements.txt

      - if: steps.changes.outputs.run == 'true'
        run: python -m pytest
