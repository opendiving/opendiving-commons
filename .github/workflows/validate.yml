name: Validate

on:
  pull_request:
    # `edited` re-runs the check when a contributor ticks the attestation in the description;
    # GitHub's default types leave it out. `synchronize` is what lets `validate` be a required
    # check: one has to have passed on the pull request's latest head.
    types: [opened, edited, reopened, synchronize]

# Read-only, and on a fork it could be nothing else: the output is a job summary and
# annotations, never a comment, so no run here needs a write token or `pull_request_target`.
permissions:
  contents: read

jobs:
  # The required check. Its job id is the status-check context the `main` ruleset names, so
  # this job carries no `name:` - a display name would replace the id as the context, and the
  # ruleset would wait on a check that never reports.
  validate:
    runs-on: ubuntu-latest
    steps:
      # The merge commit GitHub builds for the pull request, and its first parent - the base
      # branch as it stands - so `HEAD^1..HEAD` is exactly what merging would change.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      # Fails on a broken record, and on a contribution whose description lacks the
      # attestation, ticked. Nothing else fails this job.
      - name: The record rules
        run: python scripts/validate.py --base HEAD^1 --event "$GITHUB_EVENT_PATH"

      # Advisory: it exits zero whatever it finds. It runs even when the rules fail, because
      # the nearest records are what a contributor fixing a position wants to see.
      - name: Possible duplicates
        if: ${{ !cancelled() }}
        env:
          DEDUP_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          DEDUP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/dedup.py --base HEAD^1

  # Not a required check, so a contribution never waits on it. A job cannot carry a path
  # filter of its own, and a workflow-level one would skip `validate` too, so the job reads
  # the changed paths itself and passes without running anything when no code changed.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Did the code change?
        id: changes
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(scripts/|tests/|requirements\.txt$|\.github/workflows/validate\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under scripts/ or tests/ changed; no tests to run."
          fi

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.13"

      - if: steps.changes.outputs.run == 'true'
        run: pip install -r requirements.txt

      - if: steps.changes.outputs.run == 'true'
        run: python -m pytest
